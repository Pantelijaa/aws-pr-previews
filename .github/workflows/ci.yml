name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the commit history, which needs more than the default single commit.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: dist/ matches source
        run: git diff --exit-code -- dist
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    env:
      ADAPTER: public.ecr.aws/awsguru/aws-lambda-adapter:1.0.1
    steps:
      - uses: actions/checkout@v5
      # public.ecr.aws returns 429 for anonymous pulls from busy runners, so the
      # adapter image is pulled once and kept in the Actions cache.
      - uses: actions/cache@v4
        id: adapter
        with:
          path: lambda-adapter.tar
          key: lambda-adapter-1.0.1
      - if: steps.adapter.outputs.cache-hit != 'true'
        run: docker pull "$ADAPTER" && docker save "$ADAPTER" -o lambda-adapter.tar
      - if: steps.adapter.outputs.cache-hit == 'true'
        run: docker load -i lambda-adapter.tar
      - run: docker build -t demo-app:ci examples/demo-app
